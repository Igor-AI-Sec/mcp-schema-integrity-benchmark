[project]
name = "mcp-schema-integrity-benchmark"
version = "0.1.0"
description = "Benchmarks a canonical-hash + rule-based-diff approach to detecting MCP-like tool schema mutations between trusted registration and later invocation, using synthetic fixtures only."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
